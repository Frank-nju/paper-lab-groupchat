project:
  data_dir: data
  output_dir: outputs
  log_dir: logs
  paper_file: candidate_paper.pdf

workflow:
  max_paper_chars: 80000
  discussion_sentences: 1
  preserve_original: true

models:
  gpt6:
    model: gpt-6
    api_key_env: GPT6_API_KEY
    base_url_env: GPT6_BASE_URL
    temperature: 0.2
  fable51:
    model: fable-5.1
    api_key_env: FABLE51_API_KEY
    base_url_env: FABLE51_BASE_URL
    temperature: 0.2
  cheap:
    model: cheap-model
    api_key_env: CHEAP_API_KEY
    base_url_env: CHEAP_BASE_URL
    temperature: 0.1
