[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-lab-groupchat"
version = "0.1.0"
description = "固定顺序的 GPT-6/Fable 5.1/廉价模型论文群聊"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
